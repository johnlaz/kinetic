<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">How Kinetic Capital works</title><desc id="d">Weights and assumptions feed the covariance model, which drives the analytics tabs; the optional AI scan reads the result</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#36b2f5"/></marker></defs>
