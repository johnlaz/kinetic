    <text x="155" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#3dd68c">1 · You set</text>
    <text x="155" y="182" text-anchor="middle" font-size="15" fill="#9fb4c9">17-ETF weights</text>
    <text x="155" y="206" text-anchor="middle" font-size="15" fill="#9fb4c9">capital · risk-free rate</text>
