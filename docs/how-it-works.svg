    <text x="470" y="182" text-anchor="middle" font-size="15" fill="#9fb4c9">σp = √(Wᵀ·Σ·W)</text>
    <text x="470" y="206" text-anchor="middle" font-size="15" fill="#9fb4c9">Sharpe · return · income</text>
    <rect x="670" y="30" width="240" height="64" rx="10" fill="#131a24" stroke="#2a3f57"/><text x="790" y="68" text-anchor="middle" font-size="16">Efficient frontier</text>
    <rect x="670" y="108" width="240" height="64" rx="10" fill="#131a24" stroke="#2a3f57"/><text x="790" y="146" text-anchor="middle" font-size="16">10-year Monte Carlo</text>
    <rect x="670" y="186" width="240" height="64" rx="10" fill="#131a24" stroke="#2a3f57"/><text x="790" y="224" text-anchor="middle" font-size="16">12 stress scenarios</text>
